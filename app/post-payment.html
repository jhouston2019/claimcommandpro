<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setting up your account — Claim Command Pro</title>
  <style>
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(20,184,166,0.2);
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p {
      font-size: 15px;
      color: rgba(255,255,255,0.6);
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Setting up your account...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const situation = params.get('situation')
      || sessionStorage.getItem('ccp_situation')
      || 'loss';
    sessionStorage.removeItem('ccp_situation');

    const pathB = [
      'estimate',
      'lowball',
      'denied'
    ];

    const destination = pathB.includes(situation)
      ? '/app/claim-command-center.html?start=estimate'
      : '/app/claim-command-center.html';

    setTimeout(() => {
      window.location.href = destination;
    }, 1200);
  </script>
</body>
</html>
